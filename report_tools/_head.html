<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주도주 사이클 정기 리포트 — [[DATE]]</title>
<style>
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;margin:0;background:#F4F6FA;color:#222;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px}
h1{color:#1F3864;font-size:26px;margin:8px 0 14px;padding-bottom:10px;border-bottom:3px solid #1F3864}
h2{color:#1F3864;font-size:19px;margin:30px 0 12px;padding-left:10px;border-left:5px solid #1F3864}
h3{color:#1F3864;font-size:16px;margin:0 0 8px}
.sub{display:block;background:#EAF1FA;border-left:5px solid #2E75B6;color:#1F3864;font-weight:700;padding:12px 16px;border-radius:6px;margin:14px 0}
.banner{background:#1F3864;color:#fff;padding:14px 18px;border-radius:8px;margin:14px 0;font-size:14.5px;line-height:1.8}
.banner b{color:#FFD54F}
.card{background:#fff;border-left:6px solid #1F3864;border-radius:8px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card ul,.warnbox ul{margin:6px 0 0;padding-left:20px}
.card li,.warnbox li{margin:5px 0}
.warnbox{background:#FFF8E1;border:1px solid #F0C36D;border-radius:8px;padding:14px 18px;margin:14px 0}
.notice{background:#EAF1FA;border:1px solid #9DC3E6;border-radius:8px;padding:12px 18px;margin:14px 0}
.disclaimer{background:#FDECEC;border:2px solid #D9534F;color:#A12622;font-weight:700;border-radius:8px;padding:12px 18px;margin:14px 0}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
th{background:#1F3864;color:#fff;padding:8px 8px;white-space:nowrap;font-weight:700}
td{border-bottom:1px solid #E3E8EF;padding:7px 8px;vertical-align:top}
.dt{white-space:nowrap}
.pos{color:#1E7A3C;font-weight:600}
.neg{color:#C0392B;font-weight:600}
.small{font-size:12px;color:#666}
.chart{background:#fff;border-radius:8px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chart img{width:100%;display:block}
</style>
</head>
